<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <title>Workshop Registration - Choose a Workshop</title>
    <style type="text/css">
        body {
            width: 800px;
            margin: auto;
            font-family: Arial, sans-serif;
        }
        h1 {
            color: #333;
        }
        form {
            margin-top: 20px;
        }
        .workshop-option {
            margin: 10px 0;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
        .workshop-option:hover {
            background-color: #f5f5f5;
        }
        .error {
            color: red;
        }
    </style>
</head>
<body>
<header>
    <h1>Welcome to our Workshop Registration App</h1>
</header>
<main>
    <!-- Display the errorMessage here (only if it exists), using the "error" class -->
    <p class="error" th:if="${errorMessage != null}" th:text="${errorMessage}"></p>

    <form action="/" method="GET">
        <h2>Search workshops:</h2>
        <label>Title or category contains:</label>
        <input type="text" name="text" th:value="${searchText}">
        <label>Max price:</label>
        <input type="number" name="maxPrice" min="0" step="0.01" th:value="${maxPrice}">
        <input type="submit" value="Search">
    </form>

    <form action="/registration" method="POST">
        <h2>Choose a workshop:</h2>
        <!-- Display a radio button for each workshop,
             the value should be the workshop title
             and the displayed text should be:
             Title: <title>, Category: <category>, Price: <price> MKD, Free seats: <capacity>
             Workshops with 0 free seats are shown, but their radio button is disabled -->

        <div class="workshop-option" th:each="workshop : ${workshops}">
            <label>
                <input type="radio"
                       name="workshopTitle"
                       th:value="${workshop.title}"
                       th:disabled="${workshop.capacity == 0}">
                <span th:text="'Title: ' + ${workshop.title}
                        + ', Category: ' + ${workshop.category}
                        + ', Price: ' + ${workshop.price}
                        + ' MKD, Free seats: ' + ${workshop.capacity}"></span>
            </label>
        </div>

        <h2>Enter your information:</h2>
        <label>Your Name:</label>
        <input type="text" name="participantName" required><br/>
        <label>Your Email:</label>
        <input type="email" name="participantEmail" required><br/>

        <h2>Choose number of seats:</h2>
        <input type="number" name="numSeats" min="1" required><br/>
        <br/>
        <input type="submit" value="Register">
    </form>
</main>
</body>
</html>

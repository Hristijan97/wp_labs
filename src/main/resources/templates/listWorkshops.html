<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <title>Workshop Registration - Choose a Workshop</title>
    <style type="text/css">
        body {
            width: 900px;
            margin: auto;
            font-family: Arial, sans-serif;
        }
        h1 {
            color: #333;
        }
        form {
            margin-top: 20px;
        }
        .error {
            color: red;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        table, td, th {
            border: 1px solid #333;
        }
        th {
            background-color: #2E86C1;
            color: white;
            padding: 10px;
        }
        td {
            padding: 8px;
        }
        .btn {
            padding: 5px 10px;
            margin-right: 5px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
        }
        .btn-edit {
            background-color: #f0ad4e;
            border: none;
            color: white;
        }
        .btn-delete {
            background-color: #d9534f;
            border: none;
            color: white;
        }
        .btn-add {
            background-color: #5cb85c;
            border: none;
            color: white;
            padding: 8px 15px;
            margin-bottom: 15px;
            display: inline-block;
        }
    </style>
</head>
<body>
<header>
    <h1>Welcome to our Workshop Registration App</h1>
</header>
<main>
    <!-- Display the errorMessage here (only if it exists), using the "error" class -->
    <p class="error" th:if="${errorMessage != null}" th:text="${errorMessage}"></p>

    <a href="/workshops/workshop-form" class="btn-add">Add New Workshop</a>

    <form action="/workshops" method="GET">
        <h2>Search workshops:</h2>
        <label>Title or category contains:</label>
        <input type="text" name="text" th:value="${searchText}">
        <label>Max price:</label>
        <input type="number" name="maxPrice" min="0" step="0.01" th:value="${maxPrice}">
        <input type="submit" value="Search">
    </form>

    <h2>All Workshops</h2>
    <table>
        <tr>
            <th>Title</th>
            <th>Category</th>
            <th>Price (MKD)</th>
            <th>Free seats</th>
            <th>Instructor</th>
            <th>Actions</th>
        </tr>
        <tr th:each="workshop : ${workshops}">
            <td th:text="${workshop.title}"></td>
            <td th:text="${workshop.category}"></td>
            <td th:text="${workshop.price}"></td>
            <td th:text="${workshop.capacity}"></td>
            <td th:text="${workshop.instructor.name + ' ' + workshop.instructor.surname}"></td>
            <td>
                <a th:href="@{'/workshops/workshop-form/' + ${workshop.id}}" class="btn btn-edit">Edit</a>
                <form th:action="@{'/workshops/delete/' + ${workshop.id}}" method="post" style="display:inline;">
                    <button type="submit" class="btn btn-delete">Delete</button>
                </form>
            </td>
        </tr>
    </table>

    <form action="/registration" method="POST">
        <h2>Choose a workshop:</h2>
        <!-- Display a radio button for each workshop,
             the value should be the workshop title
             and the displayed text should be:
             Title: <title>, Category: <category>, Price: <price> MKD, Free seats: <capacity>
             Workshops with 0 free seats are shown, but their radio button is disabled -->

        <div class="workshop-option" th:each="workshop : ${workshops}">
            <label>
                <input type="radio"
                       name="workshopTitle"
                       th:value="${workshop.title}"
                       th:disabled="${workshop.capacity == 0}">
                <span th:text="'Title: ' + ${workshop.title}
                        + ', Category: ' + ${workshop.category}
                        + ', Price: ' + ${workshop.price}
                        + ' MKD, Free seats: ' + ${workshop.capacity}
                        + ', Instructor: ' + ${workshop.instructor.name + ' ' + workshop.instructor.surname}"></span>
            </label>
        </div>

        <h2>Enter your information:</h2>
        <label>Your Name:</label>
        <input type="text" name="participantName" required><br/>
        <label>Your Email:</label>
        <input type="email" name="participantEmail" required><br/>

        <h2>Choose number of seats:</h2>
        <input type="number" name="numSeats" min="1" required><br/>
        <br/>
        <input type="submit" value="Register">
    </form>
</main>
</body>
</html>
